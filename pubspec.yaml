name: night_owl_ub
description: NightOwl UB — Улаанбаатарын шөнийн амьдралын нийгэм сүлжээ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend — Supabase (replaces Firebase for data/auth)
  supabase_flutter: ^2.5.0

  # Push notifications — Firebase Cloud Messaging (хожим нэмнэ)
  # firebase_core: ^2.32.0
  # firebase_messaging: ^14.9.4
  # flutter_local_notifications: ^17.2.1

  # Maps (хожим нэмнэ)
  # google_maps_flutter: ^2.6.0
  # geolocator: ^11.0.0

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  video_player: ^2.8.6
  pointer_interceptor: ^0.10.1

  # Storage / local
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Fonts & UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2

  # Utils
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  cupertino_icons: ^1.0.8

  # Phone-frame preview (debug орчинд утсан дээр шиг харуулна)
  device_preview: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/illustrations/
    - assets/icons/
    - assets/animations/
