      <stop stop-color="#BDF6FF"/><stop offset=".55" stop-color="#22E7FF"/><stop offset="1" stop-color="#3AA0FF"/>
    </linearGradient>
    <linearGradient id="am" x1="84" y1="56" x2="156" y2="160" gradientUnits="userSpaceOnUse">
