<svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cy" x1="40" y1="40" x2="200" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BDF6FF"/><stop offset=".55" stop-color="#22E7FF"/><stop offset="1" stop-color="#3AA0FF"/>
    </linearGradient>
    <linearGradient id="mg" x1="80" y1="60" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/><stop offset=".5" stop-color="#C026D3"/><stop offset="1" stop-color="#FF2D8E"/>
    </linearGradient>
  </defs>
  <!-- orbital ring -->
  <circle cx="120" cy="120" r="104" stroke="#22E7FF" stroke-opacity=".14" stroke-width="2"/>
  <circle cx="120" cy="120" r="104" stroke="url(#cy)" stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="2 26" stroke-opacity=".6"/>
  <!-- cocktail bowl -->
  <path d="M70 84 L170 84 L120 142 Z" stroke="url(#cy)" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- liquid surface -->
  <path d="M88 96 L152 96" stroke="url(#mg)" stroke-width="3" stroke-linecap="round"/>
  <!-- stem + base -->
  <path d="M120 142 L120 182 M96 182 L144 182" stroke="url(#cy)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- olive pick -->
  <path d="M132 70 L118 110" stroke="#BDF6FF" stroke-width="2" stroke-linecap="round" stroke-opacity=".8"/>
  <circle cx="116" cy="114" r="9" fill="url(#mg)"/>
  <circle cx="116" cy="114" r="3.4" fill="#B4FF2E"/>
  <!-- rising bubbles -->
  <circle cx="108" cy="120" r="2" fill="#22E7FF"/>
  <circle cx="128" cy="128" r="1.6" fill="#22E7FF" fill-opacity=".8"/>
  <circle cx="120" cy="134" r="1.4" fill="#BDF6FF" fill-opacity=".7"/>
  <!-- sparkles -->
  <path d="M176 66 l0 14 M169 73 l14 0" stroke="#B4FF2E" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M58 150 l0 10 M53 155 l10 0" stroke="#22E7FF" stroke-width="2" stroke-linecap="round"/>
  <!-- focal node -->
  <circle cx="120" cy="58" r="4.5" fill="#22E7FF"/>
  <circle cx="200" cy="150" r="3" fill="#FF2D8E"/>
</svg>
