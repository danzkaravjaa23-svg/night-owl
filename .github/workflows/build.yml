name: Validate Night Owl builds
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check social privacy and pilot SQL on an isolated database
        run: |
          mkdir -p "$RUNNER_TEMP/nightowl-social-sql"
          npm install --prefix "$RUNNER_TEMP/nightowl-social-sql" @electric-sql/pglite@0.5.8 --ignore-scripts --no-audit --no-fund
          node tools/deployment/tests/run_social_discovery_fixture.mjs "$RUNNER_TEMP/nightowl-social-sql/node_modules/@electric-sql/pglite/dist/index.js"
          node backend/tests/run_readiness_fixture.mjs "$RUNNER_TEMP/nightowl-social-sql/node_modules/@electric-sql/pglite/dist/index.js"
      - run: python3 -m unittest discover -s tools/deployment/tests -v
      - run: python3 -m unittest discover -s tools/migration/tests -v
      - run: python3 -m unittest discover -s backend/tests -v
      - run: sh tools/deployment/build_web.sh
      - run: flutter build appbundle --release --dart-define=DEVICE_PREVIEW=false --dart-define-from-file=build/backend-defines.json
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-android-and-web
          path: |
            build/web
            build/app/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tools/deployment/build_admin_clients.py --output build/client-bundle --defines-output build/backend-defines.json --execute
      - run: flutter build ios --release --no-codesign --dart-define=DEVICE_PREVIEW=false --dart-define-from-file=build/backend-defines.json
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios
          path: build/ios/iphoneos/Runner.app
