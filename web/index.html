<!DOCTYPE html>
<html lang="mn">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101421">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Улаанбаатарын газрууд, оройн үйл явдал, найзуудын дурсамж.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Night Owl UB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Night Owl UB</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { color-scheme: dark light; --startup-bg: #0b0d17; --startup-text: #f5f3ff; --startup-muted: #b2b8ce; }
    html, body { margin: 0; background: var(--startup-bg); }
    #night-owl-startup {
      position: fixed; inset: 0; z-index: 2147483647;
      display: grid; place-items: center; overflow: auto;
      padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
      box-sizing: border-box; text-align: center;
      background: radial-gradient(ellipse at 50% 40%, #7654d61c, transparent 65%), var(--startup-bg);
      color: var(--startup-text); font: 400 15px/1.5 system-ui, sans-serif;
    }
    .startup-content { width: min(100%, 320px); margin: auto; }
    .startup-logo { width: 96px; height: 96px; border-radius: 26px; animation: owl-float 3s ease-in-out infinite; }
    .startup-brand { margin: 20px 0 28px; font-size: 27px; font-weight: 700; letter-spacing: -.8px; }
    .startup-brand span { color: #b6a4ff; }
    #startup-message { margin: 0; font-size: 15px; font-weight: 600; }
    #startup-detail { margin: 8px 0 0; color: var(--startup-muted); font-size: 13px; }
    .startup-dots { display: flex; justify-content: center; gap: 7px; margin-top: 20px; }
    .startup-dots i { width: 5px; height: 5px; border-radius: 50%; background: #b6a4ff; animation: owl-dot 1.4s ease-in-out infinite; }
    .startup-dots i:nth-child(2) { animation-delay: .16s; }
    .startup-dots i:nth-child(3) { animation-delay: .32s; }
    #startup-retry { margin-top: 24px; min-height: 48px; padding: 12px 24px; border: 0; border-radius: 18px; background: #7654d6; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    #startup-retry:focus-visible { outline: 3px solid #b6a4ff; outline-offset: 4px; }
    #night-owl-startup[data-state="error"] .startup-logo { animation: none; }
    #night-owl-startup[data-state="error"] .startup-dots { display: none; }
    @keyframes owl-float { 50% { transform: translateY(-5px); } }
    @keyframes owl-dot { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-color-scheme: light) {
      :root { --startup-bg: #f5f3ff; --startup-text: #211d35; --startup-muted: #57536d; }
      .startup-brand span { color: #7654d6; }
    }
    @media (prefers-reduced-motion: reduce) {
      .startup-logo, .startup-dots i { animation: none; }
    }
  </style>
</head>
<body>
  <div id="night-owl-startup" data-state="loading">
    <div class="startup-content">
      <img class="startup-logo" src="icons/Icon-192.png" width="96" height="96" alt="" fetchpriority="high">
      <div class="startup-brand" aria-label="Night Owl">night <span>owl</span></div>
      <div role="status" aria-live="polite" aria-atomic="true" id="startup-status" aria-busy="true">
        <p id="startup-message">Night Owl-ийг ачаалж байна</p>
        <p id="startup-detail">Түр хүлээгээрэй</p>
      </div>
      <div class="startup-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <button id="startup-retry" type="button" hidden>Дахин оролдох</button>
    </div>
  </div>
  <noscript>
    <style>#night-owl-startup { display: none; }</style>
    <p style="padding: 32px; color: var(--startup-text); font-family: system-ui; text-align: center;">Night Owl-ийг нээхийн тулд хөтчийн JavaScript тохиргоог идэвхжүүлнэ үү.</p>
  </noscript>
  <script id="night-owl-startup-controller">
    (function () {
      var loading = document.getElementById('night-owl-startup');
      var message = document.getElementById('startup-message');
      var detail = document.getElementById('startup-detail');
      var status = document.getElementById('startup-status');
      var retry = document.getElementById('startup-retry');
      var finished = false;

      function fail() {
        if (finished) return;
        loading.dataset.state = 'error';
        status.setAttribute('aria-busy', 'false');
        message.textContent = 'Аппыг ачаалж чадсангүй';
        detail.textContent = 'Интернет холболтоо шалгаад дахин оролдоно уу.';
        retry.hidden = false;
      }

      function isStartupScript(source) {
        if (!source) return false;
        try {
          var url = new URL(source, document.baseURI);
          return ['flutter_bootstrap.js', 'main.dart.js'].some(function (file) {
            return url.href === new URL(file, document.baseURI).href;
          });
        } catch (_) { return false; }
      }

      function onScriptError(event) {
        // The Flutter callback API does not reject failed main.dart.js loads.
        // Capture that resource failure as well as a broken bootstrap script.
        var source = event.target && event.target.tagName === 'SCRIPT'
          ? event.target.src : event.filename;
        if (isStartupScript(source)) fail();
      }

      retry.addEventListener('click', function () { window.location.reload(); });
      window.nightOwlStartup = {
        fail: fail,
        stage: function (label) {
          if (!finished && loading.dataset.state !== 'error') message.textContent = label;
        }
      };
      window.addEventListener('error', onScriptError, true);
      window.addEventListener('flutter-first-frame', function () {
        finished = true;
        loading.remove();
        window.removeEventListener('error', onScriptError, true);
        delete window.nightOwlStartup;
      }, { once: true });
    })();
  </script>
  <script id="night-owl-update-controller">
    (function () {
      // A retired worker can still control this document until navigation. Finish
      // cleanup before Flutter starts, and never refresh an already-running app.
      var base = new URL('.', document.baseURI);
      var workerUrl = new URL('flutter_service_worker.js', base);
      var guardKey = 'night-owl-worker-retirement:' + base.pathname;
      var flutterCaches = ['flutter-app-cache', 'flutter-temp-cache', 'flutter-app-manifest'];

      function isOwnWorker(worker) {
        if (!worker || !worker.scriptURL) return false;
        try {
          var url = new URL(worker.scriptURL);
          return url.origin === workerUrl.origin && url.pathname === workerUrl.pathname;
        } catch (_) { return false; }
      }

      function loadApp() {
        var script = document.createElement('script');
        script.src = new URL('flutter_bootstrap.js', base).href;
        script.async = true;
        script.onerror = function () {
          if (window.nightOwlStartup) window.nightOwlStartup.fail();
        };
        document.body.appendChild(script);
      }

      async function onlineRelease() {
        if (navigator.onLine === false) return null;
        var abort = new AbortController();
        var timeout = setTimeout(function () { abort.abort(); }, 3500);
        try {
          var url = new URL('release.json', base);
          // The old Flutter worker only intercepts known resource keys. A unique
          // query also avoids a successful HTTP cache hit being mistaken for online.
          url.searchParams.set('night_owl_probe', Date.now().toString(36));
          var response = await fetch(url.href, {
            cache: 'no-store', credentials: 'omit', signal: abort.signal
          });
          if (!response.ok || response.redirected) return null;
          var release = await response.json();
          return /^[a-f0-9]{40}$/.test(release.commit || '') ? release.commit : null;
        } catch (_) { return null; }
        finally { clearTimeout(timeout); }
      }

      async function retireLegacyWorker() {
        if (!('serviceWorker' in navigator)) return false;
        var controlled = isOwnWorker(navigator.serviceWorker.controller);
        var registrations = await navigator.serviceWorker.getRegistrations();
        var own = registrations.filter(function (registration) {
          return registration.scope === base.href && [registration.active,
            registration.waiting, registration.installing].some(isOwnWorker);
        });
        if (!controlled && own.length === 0) return false;
        var commit = await onlineRelease();
        // Preserve the cached app if the network is unavailable or a captive
        // portal returned HTML. The next opening can try retirement again.
        if (!commit) return false;
        if (window.nightOwlStartup) window.nightOwlStartup.stage('Шинэ хувилбарыг нээж байна');
        var removed = await Promise.all(own.map(function (registration) {
          return registration.unregister();
        }));
        if (removed.some(function (success) { return !success; })) return false;
        if (window.caches && window.caches.keys) {
          var keys = await window.caches.keys();
          await Promise.all(keys.filter(function (key) {
            return flutterCaches.indexOf(key) !== -1;
          }).map(function (key) { return window.caches.delete(key); }));
        }
        if (!controlled) return false;
        // Restrictive browsers may deny sessionStorage. In that case continue
        // without an automatic navigation; do not risk a refresh loop.
        try {
          if (window.sessionStorage.getItem(guardKey) === commit) return false;
          window.sessionStorage.setItem(guardKey, commit);
          if (window.sessionStorage.getItem(guardKey) !== commit) return false;
        } catch (_) { return false; }
        window.location.reload();
        return true;
      }

      retireLegacyWorker().then(function (reloading) {
        if (!reloading) loadApp();
      }, loadApp);
    })();
  </script>
</body>
</html>
